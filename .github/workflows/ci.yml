name: CI

on: [push, pull_request]

jobs:
  build:
    strategy:
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
        cc: [gcc, clang]

    runs-on: ${{ matrix.os }}

    steps:
    - uses: actions/checkout@v4

    - name: Build
      run: |
        # On Windows `cc` is MinGW-w64 GCC, which ignores the MSVC-only
        # `#pragma comment(lib, "ws2_32.lib")` inside mbparse.c — it emits
        # "warning: ignoring '#pragma comment '" under -pedantic and does not
        # link the library. Name it explicitly, so the build does not depend on
        # a pragma only MSVC honours (see Makefile, OS=Windows_NT).
        LDFLAGS=""
        if [ "$RUNNER_OS" = "Windows" ]; then LDFLAGS="-lws2_32"; fi
        cc -O2 -Wall -Wextra -pedantic -std=c99 -o mbparse mbparse.c $LDFLAGS
      shell: bash

    - name: Test (make test)
      run: |
        if command -v make >/dev/null 2>&1; then
          make test
        else
          echo "make not available — building and running the same tests directly"
          cc -O2 -Wall -Wextra -pedantic -std=c99 -I. -o mbtest tests/test_mbparse.c
          cc -O2 -Wall -Wextra -pedantic -std=c99 -I. -o fuzz_frames tests/fuzz_frames.c
          ./mbtest
          ./fuzz_frames 5000
          ./fuzz_frames --repro
          ./fuzz_frames --corpus corpus.txt 2000
          sh tests/cli_smoke.sh ./mbparse corpus.txt
        fi
      shell: bash

    - name: Build examples
      run: |
        cd examples
        cc -O2 -Wall -Wextra -pedantic -std=c99 -o demo demo.c
        ./demo
      shell: bash
